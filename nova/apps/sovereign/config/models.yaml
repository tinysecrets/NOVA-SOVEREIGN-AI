# Free model map — OpenRouter :free primary, Ollama local fallback.
default_backend: openrouter_free

openrouter:
  default: nvidia/nemotron-3.5-lightning:free
  # Only *:free IDs are allowed by the API enforcer.
  roles:
    genie: nvidia/nemotron-3.5-lightning:free
    research: nvidia/nemotron-3.5-lightning:free
    design: nvidia/nemotron-3.5-lightning:free
    code: nvidia/nemotron-3.5-lightning:free
    qa: nvidia/nemotron-3.5-lightning:free
    report: nvidia/nemotron-3.5-lightning:free
    integration: nvidia/nemotron-3.5-lightning:free
    repair: nvidia/nemotron-3.5-lightning:free

ollama:
  host: http://127.0.0.1:11434
  num_predict: 4096
  default: qwen2.5:1.5b
  roles:
    genie: qwen2.5:1.5b
    research: qwen2.5:1.5b
    design: qwen2.5:1.5b
    code: qwen2.5:1.5b
    qa: qwen2.5:1.5b
    report: qwen2.5:1.5b
    integration: qwen2.5:1.5b
    repair: qwen2.5:1.5b
    sidekick: qwen2.5:1.5b
