# Model map — Nous Hermes combo (paid/PAYG via OpenRouter), Ollama local fallback.
# Not the crippled OpenRouter :free tier: Hermes 4 70B ~ $0.13/M in, $0.40/M out.
# The recruiter worker (nova/apps/recruiter) reads roles from its own config,
# but keeps this shared map in sync.
default_backend: openrouter

openrouter:
  default: nousresearch/hermes-4-70b
  roles:
    genie: nousresearch/hermes-4-70b      # supervisor; use hermes-4-405b for high-stakes
    research: nousresearch/hermes-4-70b
    design: nousresearch/hermes-4-70b
    code: nousresearch/hermes-4-70b
    qa: nousresearch/hermes-4-70b
    report: nousresearch/hermes-4-70b
    integration: nousresearch/hermes-4-70b
    repair: nousresearch/hermes-4-70b

ollama:
  host: http://127.0.0.1:11434
  num_predict: 4096
  default: hermes3:8b
  roles:
    genie: hermes3:8b
    research: hermes3:8b
    design: hermes3:8b
    code: hermes3:8b
    qa: hermes3:8b
    report: hermes3:8b
    integration: hermes3:8b
    repair: hermes3:8b
    sidekick: hermes3:8b